/* ======================= TULIS FIRESTORE LEWAT NATIVE HTTP =======================
   Android membatasi (throttle) request jaringan yang berasal dari WebView setelah
   ~5 menit app di background — ini bikin update lokasi patroli "macet" walau GPS
   masih aktif. CapacitorHttp adalah jalur native (di luar WebView), jadi kebal dari
   batasan ini. Dipakai KHUSUS untuk update posisi/sesi patroli (yang perlu tetap
   jalan walau HP terkunci lama); operasi Firestore lain di app ini tetap pakai SDK
   biasa seperti sebelumnya. Kalau bukan native (browser) atau CapacitorHttp tidak
   tersedia, otomatis fallback ke Firestore SDK. */
function _toFirestoreValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === "boolean") return { booleanValue: v };
  if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === "string") return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(_toFirestoreValue) } };
  if (typeof v === "object") {
    const fields = {};
    Object.keys(v).forEach(k => {
      if (v[k] !== undefined) fields[k] = _toFirestoreValue(v[k]);
    });
    return { mapValue: { fields } };
  }
  return { stringValue: String(v) };
}
function _toFirestoreFields(obj) {
  const fields = {};
  Object.keys(obj).forEach(k => {
    if (obj[k] !== undefined) fields[k] = _toFirestoreValue(obj[k]);

}
/* ======================= ANTRIAN OFFLINE (retry otomatis) =======================

   tapi disimpan dulu di HP (localStorage), lalu dicoba kirim ulang otomatis begitu
   sinyal balik. Ini TERPISAH TOTAL dari logic GPS/watcher background — cuma
   menambah lapisan "coba lagi nanti" di atas fungsi tulis Firestore yang sudah ada,
   tidak mengubah cara GPS dipantau atau kapan tracking berjalan/berhenti. */

    return [];

}

  try {
    // Batasi 500 item terakhir supaya tidak membengkak tanpa batas kalau offline lama sekali
    localStorage.setItem(PENDING_WRITES_KEY, JSON.stringify(list.slice(-500)));
  } catch (e) {
    console.warn("Gagal simpan antrian offline:", e);
  }
}
function _enqueuePendingWrite(collection, id, data) {

    collection,

    queuedAt: Date.now()

  if (_flushingPendingWrites) return; // hindari 2 proses flush tumpang tindih
  const list = _loadPendingWrites();
  if (list.length === 0) return;
  const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const Http = isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
  _flushingPendingWrites = true;
  const remaining = [];
  for (const item of list) {
    try {
      if (Http) {
        const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/${item.collection}/${item.id}`;
        await Http.request({
          url,
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          data: {
            fields: _toFirestoreFields(item.data)
          }
        });
      } else {
        await db.collection(item.collection).doc(item.id).set(item.data);
      }
    } catch (err) {
      remaining.push(item); // masih gagal (masih offline) — coba lagi di kesempatan berikutnya
    }
  }
  _savePendingWrites(remaining);
  _flushingPendingWrites = false;
  if (remaining.length < list.length) {
    console.log(`Antrian offline: ${list.length - remaining.length} titik terkirim susulan, ${remaining.length} masih menunggu sinyal.`);

// Coba flush setiap kali sinyal balik, dan sebagai jaring pengaman tambahan tiap 20 detik
// (independen dari siklus GPS — jalan terus selama app terbuka, ringan karena langsung
// keluar kalau antrian kosong).
if (typeof window !== "undefined") {
  window.addEventListener("online", () => {
    flushPendingWrites();
  });
  setInterval(() => {
    flushPendingWrites();
  }, 20000);
}

function firestoreSetNative(collection, id, data) {
  const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const Http = isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
  if (!Http) {
    return db.collection(collection).doc(id).set(data).catch(() => {
      _enqueuePendingWrite(collection, id, data);
    });
  }
  const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/${collection}/${id}`;
  return Http.request({
    url,
    method: "PATCH",
    headers: {
      "Content-Type": "application/json"
    },
    data: {
      fields: _toFirestoreFields(data)
    }
  }).catch(err => {
    console.warn("firestoreSetNative gagal (kemungkinan offline), coba fallback SDK:", err);
    return db.collection(collection).doc(id).set(data).catch(() => {
      console.warn("Fallback SDK juga gagal — disimpan ke antrian offline untuk dikirim ulang nanti.");
      _enqueuePendingWrite(collection, id, data);
    });
  });
}

/* ======================= WAKTU SERVER TERPERCAYA (ANTI MANIPULASI JAM) =======================
   Jam pada HP karyawan bisa diubah manual (dimajukan/dimundurkan) untuk mengakali status
   presensi (mis. supaya tidak tercatat Terlambat). Supaya ini tidak bisa dilakukan, semua
   pencatatan waktu presensi TIDAK memakai `new Date()` polos, melainkan disinkronkan dulu ke
   jam SERVER Firestore (lewat serverTimestamp()) dan dipakai selisihnya (offset). Dengan begitu,
   walau jam di HP diubah, jam yang benar-benar dipakai untuk menghitung status Hadir/Terlambat
   tetaplah jam server yang sebenarnya. */
let _serverTimeOffsetMs = 0; // serverTime - deviceTime (ms), 0 = belum pernah sinkron

// Helper: ambil jam dari satu provider waktu eksternal (via HTTP biasa, BUKAN Firestore),
// dengan timeout supaya tidak menggantung kalau provider itu lambat/tidak merespons.
async function _fetchTimeFromProvider(url, parseServerMs, timeoutMs = 6000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const t0 = Date.now();
    const res = await fetch(url, {
      signal: controller.signal,
      cache: "no-store"
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const t1 = Date.now();
    const serverMs = parseServerMs(data);
    if (!serverMs || Number.isNaN(serverMs)) throw new Error("Format waktu tidak dikenali");
    const roundTrip = t1 - t0;
    // Perkirakan jam server tepat di titik tengah waktu tempuh request (sama seperti sebelumnya).
    return serverMs - (t0 + roundTrip / 2);
  } finally {
    clearTimeout(timer);
  }
}
async function syncServerTime() {

  // _meta/serverTime) HANYA untuk mengetahui jam server — kedua operasi itu ikut memakai
  // kuota harian Firestore (reads & writes). Begitu kuota Firestore project ini habis,
  // verifikasi jam ini ikut ditolak server, sehingga isServerTimeTrusted() selalu false dan
  // SEMUA checkpoint/rit patroli berhenti tercatat (GPS-nya sendiri tetap jalan normal — cuma
  // pencatatan checkpoint yang butuh jam terverifikasi ini yang berhenti diam-diam). Sekarang
  // diganti pakai server waktu independen di luar Firestore (worldtimeapi.org, fallback
  // timeapi.io) yang TIDAK memakai kuota Firestore sama sekali. Sifat anti-curangnya TIDAK
  // berubah/melemah: jam yang dipakai tetap dari server luar yang tidak bisa diubah lewat jam
  // HP, tetap lewat HTTPS (tidak bisa dipalsukan tanpa membobol sertifikat SSL), dan tetap
  // dibandingkan dengan toleransi MAX_CLOCK_SKEW_MS yang sama seperti sebelumnya — cuma
  // sumbernya dipindah supaya tidak lagi bergantung pada (dan ikut membebani) Firestore.
  // Firestore _meta/serverTime disisakan sebagai fallback PALING TERAKHIR kalau kedua provider
  // luar itu gagal (mis. diblokir firewall jaringan kantor), supaya sinkronisasi jam tidak
  // berhenti total hanya karena satu jalur bermasalah.
  const providers = [() => _fetchTimeFromProvider("https://worldtimeapi.org/api/timezone/Etc/UTC", d => Date.parse(d.utc_datetime)), () => _fetchTimeFromProvider("https://timeapi.io/api/time/current/zone?timeZone=Etc/UTC", d => Date.UTC(d.year, d.month - 1, d.day, d.hour, d.minute, d.seconds, d.milliSeconds || 0))];

    try {
      _serverTimeOffsetMs = await getOffset();
      _serverTimeSyncedOnce = true;
      return _serverTimeOffsetMs;

      console.warn("Provider jam eksternal gagal, coba berikutnya:", err.message);
    }

      const serverMs = data.ts.toMillis();
      const roundTrip = t1 - t0;
      _serverTimeOffsetMs = serverMs - (t0 + roundTrip / 2);
      _serverTimeSyncedOnce = true;
    }

    // Gagal total (semua provider + fallback Firestore) — mis. benar-benar offline. Biarkan
    // offset lama dipakai (fallback aman ke jam device kalau memang belum pernah berhasil
    // sinkron sama sekali).
    console.warn("Sinkronisasi jam server gagal total:", err.message);
  }
  return _serverTimeOffsetMs;
}

  return _serverTimeSyncedOnce ? -_serverTimeOffsetMs : 0;
}
// Toleransi selisih jam (mis. keterlambatan jaringan) sebelum dianggap jam device
// sengaja diubah dan presensi diblokir.
const MAX_CLOCK_SKEW_MS = 3 * 60 * 1000;
// Apakah jam server sudah pernah berhasil disinkronkan DAN selisihnya terhadap jam device
// masih dalam toleransi wajar. Dipakai sebagai syarat sebelum mencatat waktu apa pun yang
// jadi dasar anti-curang (presensi masuk/pulang, maupun rit checkpoint) — supaya kalau
// sinkronisasi belum pernah berhasil (mis. baru buka app saat offline) kita TIDAK diam-diam
// jatuh balik ke jam device mentah tanpa peringatan.
function isServerTimeTrusted() {
  return _serverTimeSyncedOnce && Math.abs(getDeviceClockSkewMs()) <= MAX_CLOCK_SKEW_MS;

// PENTING: sebelumnya fungsi ini update tampilan lokal LALU kirim ke server TANPA ditunggu
// ("fire-and-forget", `.catch(console.error)`) — begitu dipanggil, layar HP langsung bilang
// "berhasil presensi" walau pengiriman ke server di belakang layar bisa saja gagal (mis. kuota
// Firestore habis) tanpa sepengetahuan orangnya sama sekali. Ini bisa membuat karyawan merasa
// sudah absen padahal di server TIDAK ADA datanya — baru ketahuan belakangan lewat rekap/laporan.
// Sekarang fungsi ini ASYNC dan benar-benar MENUNGGU hasil penyimpanan ke server (dengan batas
// waktu 20 detik lewat withTimeout): kalau gagal, perubahan lokal DIBATALKAN (rollback) dan error
// dilempar ke pemanggilnya, supaya orangnya diberi tahu jelas untuk coba lagi — bukan dibiarkan
// mengira sudah berhasil.
async function saveCheckIn(record) {
  store.records = [...store.records, record];
  _notifyStore();
  try {
    await withTimeout(db.collection(COL.RECORDS).doc(record.id).set(record), 20000, "Gagal menyimpan presensi ke server");
    return record;
  } catch (err) {
    store.records = store.records.filter(r => r.id !== record.id);
    _notifyStore();
    throw err;
  }
}
async function saveCheckOut(recordId, data) {
  const idx = store.records.findIndex(r => r.id === recordId);
  if (idx === -1) return null;
  const previous = store.records[idx];
  const updated = {
    ...previous,
    ...data
  };
  store.records = store.records.map(r => r.id === recordId ? updated : r);
  _notifyStore();
  try {
    await withTimeout(db.collection(COL.RECORDS).doc(recordId).update(data), 20000, "Gagal menyimpan data ke server");
    return updated;
  } catch (err) {
    store.records = store.records.map(r => r.id === recordId ? previous : r);
    _notifyStore();
    throw err;
  }
}
// Presensi (Absen Masuk) yang tanggalnya BUKAN hari ini tapi belum ada checkOutTime berarti
// petugas lupa Absen Pulang di hari itu. Begitu tanggal sudah berganti lewat jam 00.00, sistem
// otomatis mengisikan absen pulang (jam 23.59.59 di tanggal record tsb) supaya datanya tidak
// menggantung selamanya dan tidak mengganggu rekap/laporan bulanan. Ditandai autoCheckOut: true
// supaya bisa dibedakan dari absen pulang manual di riwayat/laporan.
function autoCloseStaleAttendance() {
  // JANGAN jalan kalau jam server belum pernah berhasil disinkronkan sama sekali (mis. app
  // dibuka saat offline) — getTrustedNow() saat itu masih murni jam device (offset 0), jadi
  // kalau jam/tanggal device kebetulan ngaco, presensi hari ini bisa keliru ditutup paksa.
  // Lebih aman menunda auto-close sampai sinkronisasi berikutnya berhasil (dicoba tiap 5 menit)
  // daripada bertindak berdasarkan jam yang belum terverifikasi.
  if (!_serverTimeSyncedOnce) return 0;
  const todayStr = todayDateStrWITA(getTrustedNow());
  const stale = store.records.filter(r => r.date !== todayStr && r.checkInTime && !r.checkOutTime);
  stale.forEach(r => saveCheckOut(r.id, {
    checkOutTime: "23:59:59",
    checkOutNote: "Absen pulang otomatis oleh sistem (lupa Absen Pulang).",
    autoCheckOut: true
  }).catch(err => console.warn("Gagal auto-close presensi", r.id, err)));
  recordAutoCloseLog("Presensi", stale.map(r => r.userName || r.userId));
  return stale.length;
}

function eachWeekdayInRange(startDate, endDate) {
  const dates = [];
  let cursor = new Date(startDate + "T00:00:00");
  const end = new Date(endDate + "T00:00:00");
  while (cursor <= end) {
    const dow = cursor.getDay();
    if (dow !== 0 && dow !== 6) dates.push(todayDateStr(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }
  return dates;
}
function decideLeaveRequest(id, decision) {
  const idx = store.leaves.findIndex(l => l.id === id);
  if (idx === -1) return null;
  const updated = {
    ...store.leaves[idx],
    status: decision,
    decidedAt: new Date().toISOString()
  };
  store.leaves = store.leaves.map(l => l.id === id ? updated : l);
  db.collection(COL.LEAVES).doc(id).update({
    status: decision,
    decidedAt: updated.decidedAt
  }).catch(console.error);
  if (decision === LEAVE_STATUS.APPROVED) {
    const leave = updated;
    const existingDates = new Set(store.records.filter(r => r.userId === leave.userId).map(r => r.date));
    const batch = db.batch();
    eachWeekdayInRange(leave.startDate, leave.endDate).forEach(dateStr => {
      if (existingDates.has(dateStr)) return;
      const rec = {
        id: `izin-${leave.userId}-${dateStr}`,
        userId: leave.userId,
        userName: leave.userName,
        date: dateStr,
        status: STATUS.IZIN,
        leaveId: leave.id,
        leaveReason: leave.reason,
        checkInTime: null,
        checkOutTime: null,
        checkInPhoto: null,
        checkOutPhoto: null,
        checkInLat: null,
        checkInLng: null,
        checkInAddress: null,
        checkInAccuracy: null,
        checkOutLat: null,
        checkOutLng: null,
        checkOutAddress: null
      };
      store.records = [...store.records, rec];
      existingDates.add(dateStr);
      batch.set(db.collection(COL.RECORDS).doc(rec.id), rec);
    });
    batch.commit().catch(console.error);
  }
  return updated;
}

// Total berapa kali tiap checkpoint sudah dilewati petugas, dihitung dari seluruh sesi patroli

// SEKALI (checkpointsVisited sudah dedup per sesi di PatrolTracker), jadi angka ini setara dengan

// Rekap rit per BULAN (dipakai di mode "Per Bulan" halaman Rekap Rit): untuk tiap karyawan,
// hitung total rit per checkpoint sepanjang bulan tsb, plus rincian per tanggal (untuk expand).
function getRitRecapMonthly(monthStr) {
  const [y, m] = monthStr.split("-").map(Number);
  const start = `${monthStr}-01`;
  const daysInMonth = new Date(y, m, 0).getDate();
  const end = `${monthStr}-${String(daysInMonth).padStart(2, "0")}`;
  const employees = getUsers().filter(u => u.role === ROLES.EMPLOYEE);
  const checkpoints = getCheckpoints();
  const passesInRange = store.checkpointPasses.filter(p => p.date >= start && p.date <= end);
  return employees.map(u => {
    const userPasses = passesInRange.filter(p => p.userId === u.id);
    const byCheckpoint = {};
    checkpoints.forEach(cp => {
      byCheckpoint[cp.id] = 0;
    });
    userPasses.forEach(p => {
      byCheckpoint[p.checkpointId] = (byCheckpoint[p.checkpointId] || 0) + 1;
    });
    const byDateMap = {};
    userPasses.forEach(p => {
      byDateMap[p.date] = (byDateMap[p.date] || 0) + 1;
    });
    const byDate = Object.entries(byDateMap).sort((a, b) => a[0] < b[0] ? -1 : 1).map(([date, count]) => ({
      date,
      count
    }));
    return {
      userId: u.id,
      userName: u.name,
      position: u.position,
      avatarColor: u.avatarColor,
      total: userPasses.length,
      byCheckpoint,
      byDate
    };
  }).sort((a, b) => b.total - a.total || a.userName.localeCompare(b.userName));
}

/* ======================= REKAP RIT (LINTAS CHECKPOINT PER HARI) =======================
   Berbeda dengan checkpointsVisited di atas (yang dedup 1x per sesi patroli, dipakai untuk
   skor patroli), catatan di bawah ini SENGAJA tidak di-dedup per sesi: setiap kali petugas/​
   sopir melewati (masuk radius) sebuah checkpoint dicatat sebagai satu "rit" tersendiri,
   walau checkpoint & sesi patrolinya sama, walau dalam 1 hari yang sama — supaya bisa dihitung
   sudah berapa kali (berapa rit) seseorang melewati checkpoint tersebut hari itu. */
function generateCheckpointPassId() {
  return "cpp-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function recordCheckpointPass(user, checkpoint, lat, lng) {
  // Pakai jam SERVER terpercaya (bukan new Date() polos dari device), konsisten dengan
  // pencatatan jam presensi lain — supaya tanggal & waktu rit tidak bisa dipalsukan dengan
  // mengubah jam di HP (mis. supaya rit tercatat di tanggal lain, atau merusak perbandingan
  // Bonus Rute antar tim yang dihitung per tanggal).
  const trustedNow = getTrustedNow();
  const pass = {
    id: generateCheckpointPassId(),
    userId: user.id,
    userName: user.name,
    checkpointId: checkpoint.id,
    checkpointName: checkpoint.name,
    date: todayDateStrWITA(trustedNow),
    time: trustedNow.toISOString(),
    lat,
    lng
  };
  store.checkpointPasses = [pass, ...store.checkpointPasses];
  // Pakai jalur native (CapacitorHttp) — sama seperti perbaikan update lokasi patroli
  // sebelumnya — supaya pencatatan rit checkpoint TIDAK ikut kena batasan Android yang
  // menghentikan request jaringan dari WebView setelah ~5 menit app di background. Kalau
  // petugas melewati checkpoint saat HP sudah terkunci cukup lama, catatan rit ini tetap
  // sampai ke Firestore, tidak "hilang" seperti sebelumnya.
  firestoreSetNative(COL.CHECKPOINT_PASSES, pass.id, pass);
  return pass;
}
function getCheckpointPasses() {
  return store.checkpointPasses;
}
// Rit TERAKHIR seorang karyawan pada tanggal tertentu, diambil langsung dari catatan rit asli
// (bukan dari field sekunder seperti lastRitCheckpointId yang bisa basi kalau tulisannya ke
// server gagal/telat). store.checkpointPasses sudah terurut terbaru dulu (lihat listener di atas),
// jadi cukup ambil entri PERTAMA yang cocok userId & date.
function getLastCheckpointPassForUserOnDate(userId, dateStr) {
  return store.checkpointPasses.find(p => p.userId === userId && p.date === dateStr) || null;
}
// Rekap jumlah rit (lintas checkpoint) per karyawan untuk 1 tanggal tertentu.
// checkpointId null/undefined = hitung semua checkpoint digabung (byCheckpoint tetap dipecah per checkpoint).
function getRitRecap(dateStr, checkpointId) {
  const employees = getUsers().filter(u => u.role === ROLES.EMPLOYEE);
  const allCheckpoints = getCheckpoints();
  const passesOnDate = store.checkpointPasses.filter(p => p.date === dateStr && (!checkpointId || p.checkpointId === checkpointId));
  return employees.map(u => {
    const userPasses = passesOnDate.filter(p => p.userId === u.id).sort((a, b) => a.time < b.time ? -1 : 1);
    const byCheckpoint = {};
    allCheckpoints.forEach(cp => {
      byCheckpoint[cp.id] = 0;
    });
    userPasses.forEach(p => {
      byCheckpoint[p.checkpointId] = (byCheckpoint[p.checkpointId] || 0) + 1;
    });
    return {
      userId: u.id,
      userName: u.name,
      position: u.position,
      avatarColor: u.avatarColor,
      count: userPasses.length,
      byCheckpoint,
      passes: userPasses
    };
  }).sort((a, b) => b.count - a.count || a.userName.localeCompare(b.userName));
}

   Setiap dokumen jadwal berbentuk { id, userId, userName, date: "YYYY-MM-DD", type }

   2) Menandai siapa yang belum presensi padahal terjadwal Masuk/Piket Malam (lihat getTodayScheduleStatus). */
const SCHEDULE_TYPE = {
  MASUK: "Masuk",
  PIKET_MALAM: "Piket Malam",
  OFF: "Off"
};
function getSchedules() {

}

// Menentukan apakah tanggal tsb adalah hari libur untuk karyawan ybs — dipakai supaya rekap
// (baik preview maupun PDF) tidak menandai Alpa pada hari yang jadwalnya "Off".
// Logikanya SAMA dengan getEffectiveRecordsForUserMonth: kalau ada Jadwal resmi "Off", libur.
// Kalau belum ada Jadwal sama sekali untuk tanggal itu, fallback ke aturan lama (Sabtu/Minggu libur).
function isOffDay(userId, dateStr) {
  const sch = getScheduleFor(userId, dateStr);
  if (sch) return sch.type === SCHEDULE_TYPE.OFF;
  const dow = new Date(dateStr + "T00:00:00").getDay();
  return dow === 0 || dow === 6;
}

// Normalisasi nilai bebas dari Excel ("masuk", "MASUK", "piket malam", "off", "standby", "libur", dst.) ke SCHEDULE_TYPE
function normalizeScheduleType(raw) {
  const v = String(raw || "").trim().toLowerCase();
  if (!v) return null;
  if (v.includes("piket") || v.includes("malam")) return SCHEDULE_TYPE.PIKET_MALAM;
  if (v.includes("off") || v.includes("standby") || v.includes("libur")) return SCHEDULE_TYPE.OFF;
  if (v.includes("masuk") || v.includes("hadir")) return SCHEDULE_TYPE.MASUK;
  return null;
}

// Import jadwal massal dari hasil parsing Excel (lihat parseScheduleExcelRows).
// entries: [{ userId, userName, date, type }]. Menimpa (upsert) jadwal yang sudah ada pada tanggal yang sama.
async function importSchedules(entries) {
  const batchSize = 400; // batas aman Firestore batch write
  let written = 0;
  for (let i = 0; i < entries.length; i += batchSize) {
    const chunk = entries.slice(i, i + batchSize);
    const batch = db.batch();
    chunk.forEach(entry => {
      const id = `sch-${entry.userId}-${entry.date}`;
      const doc = {
        id,
        userId: entry.userId,
        userName: entry.userName,
        date: entry.date,
        type: entry.type
      };
      batch.set(db.collection(COL.SCHEDULES).doc(id), doc);
      const idx = store.schedules.findIndex(s => s.id === id);
      if (idx === -1) store.schedules.push(doc);else store.schedules[idx] = doc;
    });
    await batch.commit();
    written += chunk.length;
  }
  store.schedules = [...store.schedules];
  // Kalau tanggal yang jadwalnya baru diimpor/diubah ternyata sudah punya presensi tersimpan (sudah absen
  // masuk sebelum jadwalnya dikoreksi), status Hadir/Terlambat/Piket Malam pada record itu perlu dihitung
  // ulang mengikuti jadwal yang baru — kalau tidak, catatan lama akan tetap terbaca "Terlambat" walau
  // jadwalnya sudah diperbaiki jadi Piket Malam/Masuk.
  entries.forEach(entry => {
    const rec = store.records.find(r => r.userId === entry.userId && r.date === entry.date);
    if (rec && rec.checkInTime) {
      const newStatus = computeStatus(rec.checkInTime, entry.type);
      if (newStatus !== rec.status) saveCheckOut(rec.id, {
        status: newStatus
      }).catch(err => console.warn("Gagal recompute status setelah import jadwal", rec.id, err));
    }
  });
  return written;
}

// Mengubah baris hasil SheetJS (header: No, Nama Karyawan, Username, 1, 2, ... 31) menjadi entries siap-import.
// monthKey format "YYYY-MM". Baris dengan username yang tidak cocok dengan karyawan terdaftar akan dikembalikan di `unmatched`.
function parseScheduleExcelRows(rows, monthKey) {
  const entries = [];
  const unmatched = [];
  const [y, m] = monthKey.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  rows.forEach(row => {
    const username = String(row["Username"] || "").trim();
    if (!username) return;
    const user = getUsers().find(u => (u.username || "").toLowerCase() === username.toLowerCase());
    if (!user) {
      unmatched.push(username);
      return;
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const type = normalizeScheduleType(row[String(day)]);
      if (!type) continue;
      const dateStr = `${monthKey}-${String(day).padStart(2, "0")}`;
      entries.push({
        userId: user.id,
        userName: user.name,
        date: dateStr,
        type
      });
    }
  });
  return {
    entries,
    unmatched
  };
}

// Sama seperti saveCheckIn/saveCheckOut — sebelumnya "fire-and-forget" (langsung dianggap
// berhasil di layar walau pengiriman ke server gagal diam-diam). Sekarang ditunggu (dengan batas
// waktu) dan MELEMPAR error kalau gagal, supaya pemanggilnya (mis. saat Absen Masuk otomatis
// memulai patroli) tahu dan bisa memberi tahu penggunanya. Selain itu, kalau gagal, tulisannya
// dimasukkan ke antrian offline (`_enqueuePendingWrite`, sistem yang sama dipakai untuk titik GPS
// patroli) supaya tetap otomatis dicoba kirim ulang di latar belakang tiap ~20 detik — jadi kalau
// nanti koneksi/kuota pulih, sesi patroli ini tetap bisa "menyusul" tersimpan tanpa petugas harus
// mengulang dari awal.
async function startPatrolSession(user, pos, opts = {}) {
  // ANTI-CURANG: pakai jam SERVER terpercaya (sama seperti recordCheckpointPass & presensi
  // masuk/pulang), supaya `date` & `startTime` sesi patroli (dasar rekap harian & durasi)
  // tidak bisa dipalsukan dengan mengubah jam HP.
  const trustedNow = getTrustedNow();
  const patrol = {
    id: generatePatrolId(),
    userId: user.id,
    userName: user.name,
    date: todayDateStrWITA(trustedNow),
    status: PATROL_STATUS.ACTIVE,
    startTime: trustedNow.toISOString(),
    endTime: null,
    path: [{
      lat: pos.lat,
      lng: pos.lng,
      t: trustedNow.toISOString()
    }],
    checkpointsVisited: [],
    totalDistanceMeters: 0,
    usesCheckpoints: opts.usesCheckpoints !== false,
    // false untuk sesi Piket Malam (tanpa checkpoint)
    autoStarted: !!opts.auto // true jika dimulai otomatis saat Absen Masuk
  };
  store.patrols = [...store.patrols, patrol];
  _notifyStore();
  try {
    await withTimeout(db.collection(COL.PATROLS).doc(patrol.id).set(patrol), 20000, "Gagal menyimpan sesi patroli ke server");
    return patrol;
  } catch (err) {
    _enqueuePendingWrite(COL.PATROLS, patrol.id, patrol);
    // Tetap dibiarkan tampil lokal (tidak di-rollback seperti presensi) — path GPS-nya sudah
    // mulai terekam otomatis dan akan menyusul tersimpan lewat antrian offline di atas begitu
    // koneksi pulih, jadi lebih baik petugas tetap kelihatan "sedang patroli" secara lokal
    // daripada kehilangan rekaman rute yang sudah mulai berjalan.
    throw err;
  }
}
function updatePatrolSession(id, data) {

  const updated = {

  firestoreSetNative(COL.PATROLS, id, updated);

}
function endPatrolSession(id, data) {

    ...data,
    status: PATROL_STATUS.COMPLETED,

  });
}

// Sesi patroli yang tanggalnya BUKAN hari ini tapi statusnya masih ACTIVE berarti petugas lupa
// Absen Pulang (atau app force-closed/HP mati) sehingga endPatrolSession() tidak sempat terpanggil.
// Tanpa pembersihan ini, sesi tsb akan terus dianggap "sedang berlangsung" lintas hari:
// - Durasi di dashboard admin membengkak jadi puluhan jam.
// - Checkpoint yang tampil adalah checkpoint hari sebelumnya (belum ke-reset).
// - totalDistanceMeters terus terakumulasi dari noise GPS karena sesi tidak pernah berhenti.
// Dipanggil sekali setiap kali aplikasi (siapa pun: admin/karyawan) selesai memuat data dari Firestore.
function autoCloseStalePatrols() {
  // Sama seperti autoCloseStaleAttendance() — jangan tutup paksa sesi patroli berdasarkan
  // jam yang belum terverifikasi ke server. Kalau belum pernah sinkron, tunda dulu.
  if (!_serverTimeSyncedOnce) return 0;
  const todayStr = todayDateStrWITA(getTrustedNow());
  const stale = store.patrols.filter(p => p.status === PATROL_STATUS.ACTIVE && p.date !== todayStr);
  stale.forEach(p => endPatrolSession(p.id, {

  }));
  recordAutoCloseLog("Sesi Patroli", stale.map(p => p.userName || p.userId));
  return stale.length;
}

/* ======================= PENILAIAN TIM (SKOR OTOMATIS & LEADERBOARD) ======================= */
const ATTENDANCE_POINTS = {
  [STATUS.HADIR]: 100,
  [STATUS.PIKET_MALAM]: 100,
  [STATUS.ALPHA]: 0
};
const SCORE_WEIGHT_ATTENDANCE = 0.6;
const SCORE_WEIGHT_PATROL = 0.4;
const EARLY_CHECKOUT_TOLERANCE_MIN = 10; // toleransi pulang lebih awal sebelum dianggap pelanggaran
const EARLY_CHECKOUT_PENALTY = 15; // poin yang dipotong jika pulang lebih awal dari jadwal

// Menghitung berapa menit keterlambatan check-in dibanding batas jam masuk (0 jika tidak terlambat)
function getLateMinutes(record) {
  if (!record || record.status !== STATUS.TERLAMBAT || !record.checkInTime) return 0;
  const [dh, dm] = getSettings().checkInDeadline.split(":").map(Number);
  const [ch, cm] = record.checkInTime.split(":").map(Number);
  return Math.max(0, ch * 60 + cm - (dh * 60 + dm));
}

// Poin bertingkat berdasarkan menit keterlambatan: makin lama terlambat, makin besar potongan nilai
function latePointFromMinutes(min) {
  if (min <= 15) return 90;
  if (min <= 30) return 80;
  if (min <= 60) return 65;
  return 50;
}

// Deteksi pulang lebih awal dari jadwal shift (Hadir/Terlambat pakai jam pulang normal, Piket Malam pakai jam selesai piket malam)
function isEarlyCheckout(record) {
  if (!record || !record.checkOutTime) return false;
  if (record.status !== STATUS.HADIR && record.status !== STATUS.TERLAMBAT && record.status !== STATUS.PIKET_MALAM) return false;
  const s = getSettings();
  const expectedEnd = record.status === STATUS.PIKET_MALAM ? s.nightShiftEnd : s.shiftEndTime;
  if (!expectedEnd) return false;
  const [eh, em] = expectedEnd.split(":").map(Number);
  const [ch, cm] = record.checkOutTime.split(":").map(Number);
  // Piket malam lintas tengah malam: jam pulang di atas siang berarti masih di hari yang sama (belum lewat tengah malam), bukan "pulang cepat"
  if (record.status === STATUS.PIKET_MALAM && ch * 60 + cm > 12 * 60) return false;
  return eh * 60 + em - (ch * 60 + cm) > EARLY_CHECKOUT_TOLERANCE_MIN;
}

// Skor kehadiran harian: mempertimbangkan (1) status dasar, (2) gradasi menit terlambat, (3) potongan pulang lebih awal
function computeAttendanceScore(userId, monthKey) {
  const user = getUserById(userId);
  if (!user) return null;
  const records = getEffectiveRecordsForUserMonth(userId, user.name, monthKey).filter(r => r.status !== STATUS.IZIN);
  if (records.length === 0) return null;
  const total = records.reduce((sum, r) => {
    let point = r.status === STATUS.TERLAMBAT ? latePointFromMinutes(getLateMinutes(r)) : ATTENDANCE_POINTS[r.status] ?? 0;
    if (isEarlyCheckout(r)) point = Math.max(0, point - EARLY_CHECKOUT_PENALTY);
    return sum + point;
  }, 0);
  return Math.round(total / records.length);
}

// Rasio kehadiran bulanan: hari benar-benar hadir (Hadir/Terlambat/Piket Malam) dibanding hari kerja terjadwal (Izin dikecualikan dari penyebut)
function computeAttendanceRatio(userId, monthKey) {
  const user = getUserById(userId);
  if (!user) return null;
  const scheduled = getEffectiveRecordsForUserMonth(userId, user.name, monthKey).filter(r => r.status !== STATUS.IZIN);
  if (scheduled.length === 0) return null;
  const present = scheduled.filter(r => r.status === STATUS.HADIR || r.status === STATUS.TERLAMBAT || r.status === STATUS.PIKET_MALAM).length;
  return Math.round(present / scheduled.length * 100);
}

// Rincian kehadiran per bulan untuk ditampilkan sebagai chart (jumlah per status + rata-rata menit terlambat + jumlah pulang cepat)
function getAttendanceBreakdown(userId, monthKey) {
  const user = getUserById(userId);
  if (!user) return null;
  const records = getEffectiveRecordsForUserMonth(userId, user.name, monthKey);
  const lateRecords = records.filter(r => r.status === STATUS.TERLAMBAT);
  const lateMinutesList = lateRecords.map(getLateMinutes).sort((a, b) => a - b);
  // Pakai MEDIAN, bukan rata-rata biasa: satu record dengan jam check-in yang tidak wajar
  // (mis. salah input, atau seharusnya Piket Malam) tidak akan menarik angka jadi ekstrem.
  const medianLateMinutes = lateMinutesList.length ? lateMinutesList.length % 2 === 1 ? lateMinutesList[(lateMinutesList.length - 1) / 2] : Math.round((lateMinutesList[lateMinutesList.length / 2 - 1] + lateMinutesList[lateMinutesList.length / 2]) / 2) : 0;
  const maxLateMinutes = lateMinutesList.length ? lateMinutesList[lateMinutesList.length - 1] : 0;
  const LATE_OUTLIER_THRESHOLD_MIN = 180; // >3 jam dianggap tidak wajar untuk kategori "Terlambat", kemungkinan salah input
  const outlierLateCount = lateMinutesList.filter(m => m > LATE_OUTLIER_THRESHOLD_MIN).length;
  return {
    hadir: records.filter(r => r.status === STATUS.HADIR).length,
    terlambat: lateRecords.length,
    pikMalam: records.filter(r => r.status === STATUS.PIKET_MALAM).length,
    alpha: records.filter(r => r.status === STATUS.ALPHA).length,
    izin: records.filter(r => r.status === STATUS.IZIN).length,
    avgLateMinutes: medianLateMinutes,
    maxLateMinutes,
    outlierLateCount,
    earlyCheckoutCount: records.filter(isEarlyCheckout).length,
    ratio: computeAttendanceRatio(userId, monthKey)
  };
}

// Skor patroli: rata-rata persentase checkpoint yang dikunjungi dari setiap sesi patroli yang selesai bulan berjalan

   Selama admin belum pernah menyimpan pengaturan untuk sebuah tim, dipakai fallback default di

const ROUTE_TEAMS_DEFAULT = [{

// timnya berbeda dari tim lawan. 0.1 = +10 poin dari 100 pada skor patroli sesi tsb.
const ROUTE_BONUS_AMOUNT = 0.1;
function matchCheckpointNameLoose(name) {
  return (name || "").trim().toLowerCase().replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
}
// Bentuk tim yang SUDAH di-resolve untuk dipakai di seluruh app: { id, label, memberIds, route (array nama) }.
// memberIds null artinya belum pernah diatur admin — dicocokkan lewat nama (fallback lama).
function getRouteTeamsConfig() {
  const saved = getSettings().routeTeams;
  return ROUTE_TEAMS_DEFAULT.map(def => {
    const custom = saved && saved.find(t => t.id === def.id);
    if (custom) {

      return {
        id: def.id,
        label: custom.label || def.label,
        memberIds: custom.memberIds || [],
        route: route.length > 0 ? route : def.routeNames
      };
    }
    return {
      id: def.id,
      label: def.label,
      memberIds: null,
      memberNamesLower: def.memberNamesLower,
      route: def.routeNames
    };
  });
}
// Ambil state EDITABLE untuk 1 tim (dipakai halaman Pengaturan): memberIds & routeCheckpointIds
// selalu berupa ID asli, walau belum pernah disimpan (di-derive otomatis dari nama saat itu juga).
function getEditableRouteTeamState(teamId) {
  const def = ROUTE_TEAMS_DEFAULT.find(t => t.id === teamId);
  if (!def) return null;
  const saved = (getSettings().routeTeams || []).find(t => t.id === teamId);
  if (saved) {
    return {
      label: saved.label || def.label,
      memberIds: saved.memberIds || [],
      routeCheckpointIds: saved.routeCheckpointIds || []
    };
  }
  const employees = getUsers().filter(u => u.role === ROLES.EMPLOYEE);
  const memberIds = employees.filter(u => u.name && def.memberNamesLower.some(m => u.name.toLowerCase().includes(m))).map(u => u.id);
  const checkpoints = getCheckpoints();
  const routeCheckpointIds = def.routeNames.map(name => {
    const cp = checkpoints.find(c => matchCheckpointNameLoose(c.name) === matchCheckpointNameLoose(name));
    return cp ? cp.id : null;

}
// Semua tim yang diikuti user (BUKAN cuma yang pertama cocok) — beberapa petugas SENGAJA

// jadi tidak boleh berhenti di kecocokan pertama saja seperti getUserRouteTeam() lama.
function getUserRouteTeams(user) {
  if (!user) return [];
  const teams = getRouteTeamsConfig();
  return teams.filter(t => {
    if (t.memberIds) return t.memberIds.includes(user.id);
    if (t.memberNamesLower && user.name) {
      const name = user.name.toLowerCase();
      return t.memberNamesLower.some(m => name.includes(m));

// Kumpulan nama checkpoint (lowercase) yang berhasil di-rit oleh anggota sebuah tim pada 1 tanggal.

  const names = new Set();

  const map = new Map();

// Bandingkan 2 kumpulan nama checkpoint: dianggap "berbeda" hanya kalau KEDUA tim sudah patroli
// (kumpulannya tidak kosong) dan isi kumpulannya tidak persis sama.
function routeSetsDiffer(a, b) {
  if (a.size === 0 || b.size === 0) return false;
  if (a.size !== b.size) return true;
  for (const x of a) if (!b.has(x)) return true;

}
// Apakah pada tanggal ini Tim Manado & Tim Minut sama-sama patroli DAN melewati rute checkpoint
// yang berbeda satu sama lain — sesuai aturan: "kalau rit tim Manado & Minut beda, dapat nilai plus".
function hasRouteBonusOnDate(dateStr) {

// Jumlah checkpoint UNIK yang dianggap dilewati petugas pada sebuah sesi, dipakai untuk Skor
// Patroli. Digabung dari 2 sumber supaya tidak ada checkpoint yang sebenarnya sudah tercatat
// tapi "hilang" dari perhitungan:
//  1) p.checkpointsVisited — dicatat live selama sesi berstatus ACTIVE (lihat handleNewPosition).
//  2) store.checkpointPasses (rit) pada tanggal & user yang sama — catatan ini SENGAJA ditulis
//     lewat jalur native (CapacitorHttp/firestoreSetNative) supaya tahan dari batasan Android yang
//     menghentikan request WebView setelah app lama di background (lihat recordCheckpointPass).
//     Kalau karena race/timing tertentu sebuah checkpoint sempat tercatat sebagai rit tapi entah
//     kenapa tidak ikut masuk ke checkpointsVisited sesi tsb, sumber #2 ini menutup celah itu.
function getSessionCheckpointNames(p) {
  const names = new Set((p.checkpointsVisited || []).map(v => matchCheckpointNameLoose(v.name)));
  // PENTING: dibatasi ke rentang waktu sesi ini (startTime..endTime), BUKAN cuma tanggal yang
  // sama. Kalau 1 petugas kebetulan punya lebih dari 1 sesi patroli COMPLETED di tanggal yang
  // sama (mis. tidak sengaja "Selesai Patroli" lalu "Mulai Patroli" lagi hari itu juga), tanpa
  // batas waktu ini checkpoint dari sesi LAIN ikut "kebagi" ke sesi ini juga — skor jadi
  // dobel-dihitung padahal rit itu terjadi di sesi yang berbeda.
  const sessionEnd = p.endTime || new Date(8640000000000000).toISOString(); // sesi masih ACTIVE: tanpa batas atas
  store.checkpointPasses.forEach(cp => {
    if (cp.userId === p.userId && cp.date === p.date && cp.time >= p.startTime && cp.time <= sessionEnd) {
      names.add(matchCheckpointNameLoose(cp.checkpointName));
    }
  });
  return names;
}
// Daftar checkpoint (dari daftar checkpoint AKTIF saat ini) yang sudah dianggap dikunjungi pada
// sesi p, digabung dari 2 sumber (checkpointsVisited + checkpointPasses) — sama seperti
// getSessionCheckpointNames() di atas. Dipakai di kartu ringkasan "Peta Live Patroli" (Dashboard
// & halaman Peta Live Patroli) supaya daftar checkpoint yang ditampilkan (hijau/checklist vs
// abu-abu/belum) konsisten dengan skor patroli — checkpoint yang rit-nya sudah tercatat tidak lagi
// "nyangkut" kelihatan belum dilewati hanya karena checkpointsVisited sesi ini telat ke-update.
function getSessionVisitedCheckpoints(p, checkpointList) {
  const visitedNames = getSessionCheckpointNames(p);
  const timeByName = new Map((p.checkpointsVisited || []).map(v => [matchCheckpointNameLoose(v.name), v.time]));
  const sessionEnd = p.endTime || new Date(8640000000000000).toISOString();
  store.checkpointPasses.forEach(cp => {
    if (cp.userId === p.userId && cp.date === p.date && cp.time >= p.startTime && cp.time <= sessionEnd) {
      const key = matchCheckpointNameLoose(cp.checkpointName);
      if (!timeByName.has(key) || cp.time < timeByName.get(key)) timeByName.set(key, cp.time);
    }
  });
  return checkpointList.filter(cp => visitedNames.has(matchCheckpointNameLoose(cp.name))).map(cp => ({
    checkpointId: cp.id,
    name: cp.name,
    time: timeByName.get(matchCheckpointNameLoose(cp.name)) || null

}
// Sama seperti getSessionVisitedCheckpoints(), TAPI untuk TAMPILAN LIVE (peta live & kartu status
// "Petugas Sedang Patroli") — BUKAN untuk skor. Bedanya: tidak dibatasi ke rentang waktu sesi INI
// saja, cukup dicek per-HARI (sama seperti Rekap Rit) — supaya kalau petugas kebetulan sempat
// "Selesai Patroli" lalu "Mulai Patroli" lagi di hari yang sama, checkpoint yang sudah dilewati di
// sesi SEBELUMNYA hari itu tetap kelihatan hijau di sesi yang SEKARANG aktif (konsisten dengan apa
// yang admin lihat di Rekap Rit), bukan malah kelihatan "belum" padahal sudah tercatat.
// Skor Patroli TETAP pakai getSessionCheckpointNames()/getSessionVisitedCheckpoints() yang dibatasi
// per sesi, supaya rit dari sesi lain tidak dobel dihitung ke skor.
function getLiveVisitedCheckpoints(p, checkpointList) {
  const visitedNames = new Set((p.checkpointsVisited || []).map(v => matchCheckpointNameLoose(v.name)));
  const timeByName = new Map((p.checkpointsVisited || []).map(v => [matchCheckpointNameLoose(v.name), v.time]));
  store.checkpointPasses.forEach(cp => {
    if (cp.userId === p.userId && cp.date === p.date) {
      const key = matchCheckpointNameLoose(cp.checkpointName);
      visitedNames.add(key);
      if (!timeByName.has(key) || cp.time < timeByName.get(key)) timeByName.set(key, cp.time);
    }
  });
  return checkpointList.filter(cp => visitedNames.has(matchCheckpointNameLoose(cp.name))).map(cp => ({
    checkpointId: cp.id,
    name: cp.name,
    time: timeByName.get(matchCheckpointNameLoose(cp.name)) || null
  }));
}
function computePatrolScore(userId, monthKey) {
  const sessions = getPatrolsByUser(userId).filter(p => p.status === PATROL_STATUS.COMPLETED && p.date.startsWith(monthKey));
  if (sessions.length === 0) return null;
  const totalCp = Math.max(1, getCheckpoints().length);
  const userTeams = getUserRouteTeams(getUserById(userId));
  const total = sessions.reduce((sum, p) => {
    let sessionScore;
    if (p.usesCheckpoints === false) {
      sessionScore = 1; // Piket Malam tanpa checkpoint = penuh
    } else {
      const visitedCount = getSessionCheckpointNames(p).size;
      const ratio = Math.min(1, visitedCount / totalCp);
      sessionScore = PATROL_SESSION_BASELINE + ratio * (1 - PATROL_SESSION_BASELINE);
    }
    if (userTeams.length > 0 && hasRouteBonusOnDate(p.date)) {
      sessionScore = Math.min(1, sessionScore + ROUTE_BONUS_AMOUNT);
    }
    return sum + sessionScore;
  }, 0);
  return Math.round(total / sessions.length * 100);
}

// Skor tim gabungan: kehadiran 60% + patroli 40%. Jika belum ada data patroli, skor 100% dari kehadiran.
function computeTeamScore(userId, monthKey) {
  const attendance = computeAttendanceScore(userId, monthKey);
  const patrol = computePatrolScore(userId, monthKey);
  if (attendance == null && patrol == null) return null;
  if (patrol == null) return attendance;
  if (attendance == null) return patrol;
  return Math.round(attendance * SCORE_WEIGHT_ATTENDANCE + patrol * SCORE_WEIGHT_PATROL);
}

    colorVar: "#94a3b8"

  if (score >= 90) return {
    label: "A",

  };
  if (score >= 75) return {

  if (score >= 60) return {

  };
}
function getLeaderboard(monthKey) {
  const employees = getUsers().filter(u => u.role === ROLES.EMPLOYEE);
  const rows = employees.map(u => {
    const attendance = computeAttendanceScore(u.id, monthKey);
    const patrol = computePatrolScore(u.id, monthKey);
    const total = computeTeamScore(u.id, monthKey);
    const breakdown = getAttendanceBreakdown(u.id, monthKey);
    return {
      userId: u.id,
      userName: u.name,
      avatarColor: u.avatarColor,
      position: u.position,
      attendance,
      patrol,
      total,
      breakdown
    };
  });
  rows.sort((a, b) => (b.total ?? -1) - (a.total ?? -1));
  let rank = 0,
    prevScore = null;
  rows.forEach((r, i) => {
    if (r.total !== prevScore) rank = i + 1;
    r.rank = rank;
    prevScore = r.total;
  });
  return rows;
}

/* ======================= UTIL TANGGAL / WAKTU ======================= */
function todayDateStr(d = new Date()) {
  const y = d.getFullYear(),
    m = String(d.getMonth() + 1).padStart(2, "0"),
    day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
// Versi "todayDateStr" yang DIPAKSA hitung pakai zona waktu WITA (UTC+8), TIDAK
// bergantung pada setelan zona waktu perangkat yang menjalankan kode ini. Ini
// supaya kalau ada satu device (mis. laptop admin buka dashboard) yang zona
// waktunya salah/ke-set ke zona lain, perhitungan "hari ini" untuk keperluan
// auto-close TETAP benar — tidak bisa keliru menutup record hari yang sedang
// berjalan hanya karena device tsb salah setelan zona waktu.
function todayDateStrWITA(d = new Date()) {
  const wita = new Date(d.getTime() + 8 * 60 * 60 * 1000);
  const y = wita.getUTCFullYear(),
    m = String(wita.getUTCMonth() + 1).padStart(2, "0"),
    day = String(wita.getUTCDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
// PENTING: dipaksa hitung dalam WITA (UTC+8), sama prinsipnya dengan todayDateStrWITA() —
// TIDAK pakai d.toTimeString() biasa, karena itu mengikuti zona waktu SETELAN PERANGKAT.
// Kalau HP petugas zona waktunya nggak persis WITA (auto-detect meleset, dsb), jam yang
// kesimpen sebagai checkInTime/checkOutTime bisa geser beberapa jam walau TANGGALnya sudah
// benar WITA — dan jam inilah dasar penentuan status Hadir/Terlambat serta pulang cepat.
function nowTimeStr(d = new Date()) {
  const wita = new Date(d.getTime() + 8 * 60 * 60 * 1000);
  const h = String(wita.getUTCHours()).padStart(2, "0");
  const m = String(wita.getUTCMinutes()).padStart(2, "0");
  const s = String(wita.getUTCSeconds()).padStart(2, "0");
  return `${h}:${m}:${s}`;
}
function formatDateID(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("id-ID", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}
function formatDateShortID(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("id-ID", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}
function formatClock(d = new Date()) {
  return d.toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}
function formatTimeHM(t) {
  return t ? t.slice(0, 5) : "—";
}
// Format ISO datetime (mis. lastLoginAt) jadi "2 Agu 2026, 14:32" untuk ditampilkan
// di panel Hak Akses / riwayat login.
function formatDateTimeShortID(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  const tgl = d.toLocaleDateString("id-ID", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
  const jam = d.toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit"
  });
  return `${tgl}, ${jam}`;
}
function isLate(t) {
  return t > getSettings().checkInDeadline + ":00";
}
function isNightShift(t) {
  const s = getSettings();
  const start = (s.nightShiftStart || "17:01") + ":00";
  const end = (s.nightShiftEnd || "05:59") + ":59";
  if (start <= end) {
    // Rentang tidak melewati tengah malam (mis. 20:00–23:00): cukup dicek langsung antara start–end.
    return t >= start && t <= end;
  }
  // Rentang melewati tengah malam (mis. 17:01–05:59): mulai jam start s/d 23:59:59,
  // lalu lanjut 00:00:00 s/d end pada hari berikutnya.
  return t >= start || t <= end;
}
// scheduledType (opsional) = tipe Jadwal (SCHEDULE_TYPE) untuk karyawan & tanggal tsb.
// Kalau Jadwal bilang hari itu Piket Malam, statusnya HARUS Piket Malam — bukan dihitung Terlambat
// hanya karena jam absennya di luar jendela waktu piket malam otomatis. Kalau Jadwal bilang Masuk,
// baru dibandingkan ke jam potong (checkInDeadline). Kalau tidak ada Jadwal untuk hari itu sama sekali,
// baru dipakai deteksi otomatis dari jam absen seperti sebelumnya (fallback).
function computeStatus(t, scheduledType) {
  if (!t) return STATUS.ALPHA;
  if (scheduledType === SCHEDULE_TYPE.PIKET_MALAM) return STATUS.PIKET_MALAM;
  if (scheduledType === SCHEDULE_TYPE.MASUK) return isLate(t) ? STATUS.TERLAMBAT : STATUS.HADIR;
  if (isNightShift(t)) return STATUS.PIKET_MALAM;
  return isLate(t) ? STATUS.TERLAMBAT : STATUS.HADIR;
}
function currentMonthKey(d = new Date()) {
  return todayDateStr(d).slice(0, 7);
}
function workDurationLabel(checkIn, checkOut) {
  if (!checkIn || !checkOut) return "—";
  const [h1, m1] = checkIn.split(":").map(Number);
  const [h2, m2] = checkOut.split(":").map(Number);
  let mins = h2 * 60 + m2 - (h1 * 60 + m1);
  if (mins < 0) mins += 24 * 60;
  return `${Math.floor(mins / 60)}j ${mins % 60}m`;
}

/* ======================= DETEKSI STATUS ALPHA OTOMATIS ======================= */
/* ======================= STATUS PRESENSI YANG SELALU IKUT JADWAL TERBARU =======================
   Status Hadir/Terlambat/Piket Malam yang TERSIMPAN di suatu record dihitung SEKALI saat orang
   itu check-in, berdasarkan Jadwal yang berlaku SAAT ITU. Kalau Jadwalnya baru diperbaiki
   BELAKANGAN (mis. tadinya "Masuk" lalu dikoreksi jadi "Piket Malam" setelah orang itu check-in),
   nilai yang sudah tersimpan di server tidak otomatis ikut berubah — apalagi kalau server sedang
   menolak tulisan baru (mis. kuota Firestore harian habis). Supaya SELURUH tampilan aplikasi
   (dashboard, tabel presensi, grafik, rekap PDF, penilaian tim) selalu konsisten dengan Jadwal
   yang berlaku SEKARANG — tanpa perlu menulis apapun ke server — status dihitung ULANG di sini
   setiap kali dibaca untuk ditampilkan.
   Status lain (Izin/Off/Alpa) tidak disentuh karena bukan hasil perhitungan jam check-in. */
function effectiveRecordStatus(r) {
  if (!r || !r.checkInTime) return r ? r.status : r;
  if (r.status !== STATUS.HADIR && r.status !== STATUS.TERLAMBAT && r.status !== STATUS.PIKET_MALAM) return r.status;
  const sch = getScheduleFor(r.userId, r.date);
  return computeStatus(r.checkInTime, sch ? sch.type : undefined);
}
function withEffectiveStatus(r) {
  const status = effectiveRecordStatus(r);
  return status === r.status ? r : {
    ...r,
    status
  };
}
function getEffectiveRecordsForUserMonth(userId, userName, monthKey) {
  const real = getRecordsByUser(userId).filter(r => r.date.startsWith(monthKey)).map(withEffectiveStatus);
  const realDates = new Set(real.map(r => r.date));
  const [y, m] = monthKey.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  // Pakai jam server terpercaya + WITA dipaksa (bukan todayDateStr() device-lokal) — dipakai
  // sebagai batas "sampai tanggal berapa yang sudah lewat" untuk deteksi Alpa otomatis, rekap
  // bulanan, dan skor kehadiran. Kalau device yang membuka rekap zona waktunya bukan WITA,
  // batas ini bisa geser ±1 hari dan salah menandai/tidak menandai Alpa di hari yang belum
  // benar-benar berlalu menurut WITA.
  const todayStr = todayDateStrWITA(getTrustedNow());
  const user = getUserById(userId);
  const joinDate = user && user.joinDate ? user.joinDate : null;
  const synthetic = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${monthKey}-${String(day).padStart(2, "0")}`;
    if (dateStr >= todayStr) break;
    if (joinDate && dateStr < joinDate) continue;
    if (realDates.has(dateStr)) continue;
    const sch = getScheduleFor(userId, dateStr);
    if (sch) {
      // Ada jadwal resmi: "Off" tidak pernah dihitung Alpa; "Masuk"/"Piket Malam" tanpa presensi = Alpa.
      if (sch.type === SCHEDULE_TYPE.OFF) continue;
    } else {
      // Belum ada jadwal untuk tanggal ini: pakai aturan lama (Sabtu/Minggu dianggap libur).
      const dow = new Date(dateStr + "T00:00:00").getDay();
      if (dow === 0 || dow === 6) continue;
    }
    synthetic.push({
      id: `synthetic-${userId}-${dateStr}`,
      userId,
      userName,
      date: dateStr,
      status: STATUS.ALPHA,
      synthetic: true,
      checkInTime: null,
      checkOutTime: null,
      checkInPhoto: null,
      checkOutPhoto: null,
      checkInLat: null,
      checkInLng: null,
      checkInAddress: null,
      checkOutLat: null,
      checkOutLng: null,
      checkOutAddress: null
    });
  }
  return [...real, ...synthetic].sort((a, b) => a.date < b.date ? 1 : -1);
}

/* ======================= UTIL GEOLOKASI (Anti Fake GPS) =======================
   Berlapis 4 lapisan deteksi:
     Lapis 1 – Coordinate sanity  : koordinat 0,0 atau di luar batas bumi
     Lapis 2 – Accuracy threshold : akurasi < 1.5 m (ciri khas mock location)
     Lapis 3 – Multi-sample jump  : posisi loncat > 80 m dalam ~1.2 detik
     Lapis 4 – Speed check        : perpindahan > 250 km/jam antar dua sesi absen
   =========================================================================== */

// Referensi posisi sesi absen terakhir (untuk cek kecepatan antar absen)
const _lastKnownPosition = {
  lat: null,
  lng: null,
  timestamp: null
};
function _friendlyGeoError(err) {
  if (err.code === err.PERMISSION_DENIED) return "Izin lokasi ditolak. Buka Pengaturan HP → Izin Aplikasi → Presensi NIT → izinkan Lokasi.";
  if (err.code === err.POSITION_UNAVAILABLE) return "Lokasi GPS tidak tersedia. Pastikan GPS aktif dan coba di area terbuka.";
  if (err.code === err.TIMEOUT) return "Waktu pengambilan GPS habis. Pastikan GPS aktif, lalu coba lagi.";
  return "Gagal mengambil lokasi GPS.";
}
function _validateGpsSamples(samples) {
  if (samples.length === 0) throw new Error("Tidak ada data GPS yang berhasil diambil.");

  // ── Lapis 1: Coordinate sanity ──────────────────────────────────
  for (const s of samples) {
    if (s.lat === 0 && s.lng === 0) throw new Error("⚠️ GPS Palsu Terdeteksi: Koordinat tidak valid (0,0). " + "Harap matikan aplikasi fake GPS dan coba lagi.");
    if (Math.abs(s.lat) > 90 || Math.abs(s.lng) > 180) throw new Error("⚠️ GPS Palsu Terdeteksi: Koordinat di luar batas bumi. " + "Harap matikan aplikasi fake GPS dan coba lagi.");
  }

  // ── Lapis 2: Accuracy threshold ─────────────────────────────────
  // GPS nyata selalu punya ketidakpastian >= 3 m.
  // Mock location app hampir selalu mengembalikan accuracy = 0 atau sangat kecil.
  for (const s of samples) {
    if (s.accuracy !== null && s.accuracy !== undefined && s.accuracy < 1.5) throw new Error("⚠️ GPS Palsu Terdeteksi: Akurasi terlalu sempurna (" + s.accuracy.toFixed(1) + " m). " + "GPS asli selalu memiliki ketidakpastian > 3 m. " + "Nonaktifkan aplikasi mock location, lalu coba lagi.");
  }

  // ── Lapis 3: Multi-sample jump consistency ──────────────────────
  // Dua pembacaan berselang ~1.2 detik tidak boleh loncat > 80 m secara fisik.
  if (samples.length >= 2) {
    for (let i = 1; i < samples.length; i++) {
      const d = distanceMeters(samples[i - 1].lat, samples[i - 1].lng, samples[i].lat, samples[i].lng);
      if (d > 80) throw new Error("⚠️ GPS Palsu Terdeteksi: Posisi berpindah " + Math.round(d) + " m " + "dalam waktu 1 detik — tidak mungkin secara fisik. " + "Nonaktifkan aplikasi fake location dan coba lagi.");
    }
  }

  // Pilih sampel dengan akurasi terbaik (nilai terkecil = lebih presisi)
  const best = samples.reduce((a, b) => a.accuracy <= b.accuracy ? a : b);

  // ── Lapis 4: Speed check antar sesi absen ───────────────────────
  if (_lastKnownPosition.lat !== null && _lastKnownPosition.timestamp !== null) {
    const distM = distanceMeters(_lastKnownPosition.lat, _lastKnownPosition.lng, best.lat, best.lng);
    const dtHours = (Date.now() - _lastKnownPosition.timestamp) / 3600000;
    // Hanya cek jika selang waktu masuk akal: lebih dari 18 detik, kurang dari 24 jam
    if (dtHours > 0.005 && dtHours < 24) {
      const speedKmh = distM / 1000 / dtHours;
      if (speedKmh > 250) throw new Error("⚠️ GPS Palsu Terdeteksi: Perpindahan lokasi tidak masuk akal " + "(~" + Math.round(speedKmh) + " km/jam sejak absen terakhir). " + "Pastikan GPS aktif dan tidak menggunakan aplikasi fake location.");
    }
  }

  // Simpan posisi terpilih sebagai referensi untuk sesi absen berikutnya
  _lastKnownPosition.lat = best.lat;
  _lastKnownPosition.lng = best.lng;
  _lastKnownPosition.timestamp = Date.now();
  return {
    lat: best.lat,
    lng: best.lng,
    accuracy: best.accuracy
  };
}
function getCurrentPosition(options = {}) {
  return new Promise((resolve, reject) => {
    if (!("geolocation" in navigator)) {
      reject(new Error("Perangkat ini tidak mendukung GPS."));
      return;
    }
    const samples = [];
    const MAX_S = 3; // ambil 3 sampel untuk cross-check konsistensi
    const INTERVAL = 1200; // jeda antar sampel (ms)
    let collected = 0;
    function finish() {
      try {
        resolve(_validateGpsSamples(samples));
      } catch (err) {
        reject(err);
      }
    }
    function fallback(originalErr) {
      // Coba sekali lagi dengan akurasi rendah — lebih cepat di WebView Android
      navigator.geolocation.getCurrentPosition(pos => {
        samples.push({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        });
        finish();
      }, () => reject(new Error(_friendlyGeoError(originalErr))), {
        enableHighAccuracy: false,
        timeout: 20000,
        maximumAge: 60000
      });
    }
    function collect() {
      navigator.geolocation.getCurrentPosition(pos => {
        samples.push({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        });
        collected++;
        if (collected < MAX_S) setTimeout(collect, INTERVAL);else finish();
      }, err => {
        if (samples.length > 0) {
          // Sudah punya minimal 1 sampel valid — lanjut validasi
          finish();
        } else if (err.code === err.TIMEOUT || err.code === err.POSITION_UNAVAILABLE) {
          fallback(err);
        } else {
          reject(new Error(_friendlyGeoError(err)));
        }
      }, {
        enableHighAccuracy: true,
        timeout: 30000,
        maximumAge: 0,
        ...options
      });
    }
    collect();
  });
}
async function reverseGeocode(lat, lng) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
      headers: {
        Accept: "application/json"
      }
    });
    if (!res.ok) throw new Error("geocode failed");
    const data = await res.json();
    return data.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  } catch {
    return `${lat.toFixed(5)}, ${lng.toFixed(5)} (alamat tidak dapat dimuat)`;
  }
}

// Jarak antar dua titik koordinat (meter) memakai rumus Haversine.
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = v => v * Math.PI / 180;
  const dLat = toRad(lat2 - lat1),
    dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Arah hadap (0-360°, 0=utara) dari titik 1 ke titik 2 — dipakai buat rotasi anak panah marker.
function bearingDeg(lat1, lng1, lat2, lng2) {
  const toRad = v => v * Math.PI / 180,
    toDeg = v => v * 180 / Math.PI;
  const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// Kecepatan (km/jam) antara dua titik path berurutan berdasarkan jarak & selisih waktu.
function speedKmh(prevPoint, curPoint) {
  if (!prevPoint || !curPoint) return 0;
  const distM = distanceMeters(prevPoint.lat, prevPoint.lng, curPoint.lat, curPoint.lng);
  const dtSec = (new Date(curPoint.t) - new Date(prevPoint.t)) / 1000;
  if (dtSec <= 0) return 0;
  return distM / dtSec * 3.6;
}

// Menghaluskan garis rute yang patah-patah (zig-zag antar titik GPS) memakai algoritma
// "Chaikin corner-cutting" — dijalankan beberapa iterasi supaya sudut tajam jadi lengkung
// halus, TANPA melewati/keluar dari jalur titik aslinya (beda dgn spline yg bisa overshoot).
// iterations=2 sengaja tidak dibuat lebih tinggi: tiap iterasi ±2x lipat jumlah titik garis,
// jadi 2 iterasi = 4x titik (masih cukup halus di mata) — 3 iterasi (8x titik) bikin peta berat
// waktu zoom in/out karena renderer harus hitung ulang belasan ribu titik tiap kali.
function smoothLatLngs(latlngs, iterations = 1) {
  if (!latlngs || latlngs.length < 3) return latlngs;
  let pts = latlngs;
  for (let iter = 0; iter < iterations; iter++) {
    const next = [pts[0]]; // titik awal & akhir dipertahankan persis (posisi start/akhir rute)
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i],
        p1 = pts[i + 1];
      next.push([p0[0] * 0.75 + p1[0] * 0.25, p0[1] * 0.75 + p1[1] * 0.25], [p0[0] * 0.25 + p1[0] * 0.75, p0[1] * 0.25 + p1[1] * 0.75]);
    }
    next.push(pts[pts.length - 1]);
    pts = next;
  }
  return pts;
}

// Versi "windowed" dari smoothLatLngs — supaya biaya hitung TIDAK terus membesar seiring rute
// makin panjang (shift 8+ jam bisa punya ribuan titik GPS) atau makin banyak petugas aktif.
// Bagian rute yang sudah lewat & tidak berubah lagi "dibekukan" (dihitung sekali, disimpan di cache),
// hanya bagian ekor (titik-titik terbaru) yang dihitung ulang tiap update. Titik sambungan selalu
// persis sama (karena smoothLatLngs mempertahankan titik awal/akhir apa adanya), jadi tidak ada
// patahan/kedutan di titik sambung antara bagian beku & bagian segar.
function getSmoothedRouteCached(cache, rawLatlngs, opts = {}) {
  const { window = 220, iterations = 1 } = opts;
  if (!rawLatlngs || rawLatlngs.length < 3) return rawLatlngs || [];
  // Rute lebih pendek dari cache (mis. sesi baru dimulai) → reset total.
  if (rawLatlngs.length < cache.frozenCount) {
    cache.frozen = [];
    cache.frozenCount = 0;
  }
  // Ekor yang belum dibekukan sudah cukup panjang → bekukan bagian lama sekali saja.
  if (rawLatlngs.length - cache.frozenCount > window * 1.5) {
    const newBoundary = rawLatlngs.length - window;
    cache.frozen = smoothLatLngs(rawLatlngs.slice(0, newBoundary), iterations);
    cache.frozenCount = newBoundary;
  }
  const tailRaw = rawLatlngs.slice(Math.max(0, cache.frozenCount - 1)); // -1 = 1 titik overlap utk sambungan mulus
  const tailSmoothed = smoothLatLngs(tailRaw, iterations);
  return cache.frozen.length ? cache.frozen.concat(tailSmoothed.slice(1)) : tailSmoothed;
}

/* ======================= DETEKSI WAJAH (wajib wajah utk presensi) =======================
   Memakai face-api.js (TensorFlow.js) — model Tiny Face Detector diunduh sekali dari CDN
   lalu dipakai untuk memvalidasi bahwa objek di depan kamera memang wajah manusia,
   bukan tembok/lantai/langit/foto galeri/dsb. */
let _faceModelsPromise = null;
function loadFaceModels() {
  if (!_faceModelsPromise) {
    _faceModelsPromise = new Promise((resolve, reject) => {
      if (typeof faceapi === "undefined") {
        reject(new Error("Modul deteksi wajah tidak berhasil dimuat."));
        return;
      }
      faceapi.nets.tinyFaceDetector
        .loadFromUri("https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights")
        .then(resolve)
        .catch(reject);
    }).catch(err => {
      _faceModelsPromise = null; // izinkan dicoba ulang kalau gagal (mis. offline)
      throw err;
    });
  }
  return _faceModelsPromise;
}
async function detectFaceIn(mediaEl) {
  if (typeof faceapi === "undefined" || !mediaEl) return false;
  try {
    const result = await faceapi.detectSingleFace(mediaEl, new faceapi.TinyFaceDetectorOptions({
      inputSize: 224,
      scoreThreshold: 0.5
    }));
    return !!result;
  } catch (e) {
    return false;
  }
}

/* ======================= HOOK KAMERA (live capture, anti-galeri, wajib wajah) ======================= */
function useCamera() {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const detectTimerRef = useRef(null);
  const [isActive, setIsActive] = useState(false);
  const [error, setError] = useState(null);
  const [facingMode, setFacingMode] = useState("user");
  const [modelsReady, setModelsReady] = useState(false);
  const [modelsError, setModelsError] = useState(null);
  const [faceDetected, setFaceDetected] = useState(false);

  // Muat model deteksi wajah sekali saat hook pertama dipakai
  useEffect(() => {
    let cancelled = false;
    loadFaceModels().then(() => {
      if (!cancelled) setModelsReady(true);
    }).catch(() => {
      if (!cancelled) setModelsError("Modul deteksi wajah gagal dimuat. Periksa koneksi internet Anda lalu coba lagi.");
    });
    return () => {
      cancelled = true;
    };
  }, []);

  const stop = useCallback(() => {
    if (detectTimerRef.current) {
      clearTimeout(detectTimerRef.current);
      detectTimerRef.current = null;
    }
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    }
    setIsActive(false);
    setFaceDetected(false);
  }, []);
  const start = useCallback(async (mode = facingMode) => {
    setError(null);
    try {
      if (streamRef.current) {
        streamRef.current.getTracks().forEach(t => t.stop());
        streamRef.current = null;
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: mode,
          width: {
            ideal: 720
          },
          height: {
            ideal: 720
          }
        },
        audio: false
      });
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
      }
      setIsActive(true);
    } catch (err) {
      let message = "Tidak dapat mengakses kamera.";
      if (err.name === "NotAllowedError") message = "Izin kamera ditolak. Aktifkan izin kamera di browser untuk melanjutkan presensi.";else if (err.name === "NotFoundError") message = "Kamera tidak ditemukan pada perangkat ini.";
      setError(message);
      setIsActive(false);
    }
  }, [facingMode]);

  // Loop deteksi wajah real-time selama kamera aktif & model sudah siap.
  // Pakai self-scheduling timeout (bukan setInterval) supaya pemanggilan deteksi
  // berikutnya menunggu deteksi sebelumnya selesai — mencegah tumpukan proses
  // yang tumpang tindih di perangkat yang lebih lambat.
  useEffect(() => {
    if (!isActive || !modelsReady) return;
    let cancelled = false;
    async function loop() {
      if (cancelled) return;
      if (videoRef.current && videoRef.current.readyState >= 2) {
        const found = await detectFaceIn(videoRef.current);
        if (!cancelled) setFaceDetected(found);
      }
      if (!cancelled) {
        detectTimerRef.current = setTimeout(loop, 350);
      }
    }
    loop();
    return () => {
      cancelled = true;
      if (detectTimerRef.current) {
        clearTimeout(detectTimerRef.current);
        detectTimerRef.current = null;
      }
    };
  }, [isActive, modelsReady]);

  const switchCamera = useCallback(async () => {
    const next = facingMode === "user" ? "environment" : "user";
    setFacingMode(next);
    await start(next);
  }, [facingMode, start]);
  const capture = useCallback(() => {
    if (!videoRef.current) return null;
    const video = videoRef.current;
    const size = Math.min(video.videoWidth, video.videoHeight);
    const canvas = document.createElement("canvas");
    canvas.width = 480;
    canvas.height = 480;
    const ctx = canvas.getContext("2d");
    const sx = (video.videoWidth - size) / 2,
      sy = (video.videoHeight - size) / 2;
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, size, size, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.85);
  }, []);

  // Validasi ulang hasil foto yang sudah diambil — memastikan benar-benar ada wajah di dalamnya
  const verifyPhotoHasFace = useCallback(dataUrl => {
    return new Promise(resolve => {
      if (typeof faceapi === "undefined" || !dataUrl) {
        resolve(false);
        return;
      }
      const img = new Image();
      img.onload = async () => {
        try {
          const result = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({
            inputSize: 224,
            scoreThreshold: 0.5
          }));
          resolve(!!result);
        } catch (e) {
          resolve(false);
        }
      };
      img.onerror = () => resolve(false);
      img.src = dataUrl;
    });
  }, []);

  useEffect(() => () => stop(), [stop]);
  return {
    videoRef,
    isActive,
    error,
    start,
    stop,
    capture,
    switchCamera,
    modelsReady,
    modelsError,
    faceDetected,
    verifyPhotoHasFace
  };
}

function exportRekapPDF(user, monthKey, records) {
  const [y, m] = monthKey.split("-").map(Number);

  // ── Bangun daftar SEMUA hari dalam bulan ──────────────────────────────────
  const daysInMonth = new Date(y, m, 0).getDate();
  const recordMap = {};
  records.forEach(r => {
    recordMap[r.date] = r;
  });
  const allRows = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const rec = recordMap[dateStr];
    let status = rec ? effectiveRecordStatus(rec) : STATUS.ALPHA;
    if (!rec && isOffDay(user.id, dateStr)) status = "Standby";
    allRows.push({
      date: dateStr,
      checkInTime: rec ? rec.checkInTime : null,
      checkOutTime: rec ? rec.checkOutTime : null,
      status
    });
  }

  // ── Stats dihitung dari allRows ───────────────────────────────────────────
  const stats = {
    hadir: allRows.filter(r => r.status === STATUS.HADIR).length,
    terlambat: allRows.filter(r => r.status === STATUS.TERLAMBAT).length,
    pikMalam: allRows.filter(r => r.status === STATUS.PIKET_MALAM).length,
    alpha: allRows.filter(r => r.status === STATUS.ALPHA).length,

function formatDurationShort(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600),
    m = Math.floor(totalSec % 3600 / 60),
    s = totalSec % 60;
  if (h > 0) return `${h}j ${String(m).padStart(2, "0")}m`;
  return `${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}d`;
}

function loginDeviceLabel(ua) {
  if (!ua) return "—";
  if (/android/i.test(ua)) return "Android";
  if (/iphone|ipad|ipod/i.test(ua)) return "iOS";
  if (/windows/i.test(ua)) return "Windows";
  if (/macintosh|mac os/i.test(ua)) return "Mac";
  if (/linux/i.test(ua)) return "Linux";
  return "Perangkat lain";
}
